# Only the local cloudflared process can reach the published loopback port.
# This config must not be used with an internet-facing Docker port.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Refresh Docker service discovery after the application is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # The host-to-container bridge is private; Cloudflare overwrites this header.
    # Never expose this listener beyond 127.0.0.1.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 32k;
        client_body_timeout 10s;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        location / {
            set $linkkeep_upstream http://linkkeep:3000;
            proxy_pass $linkkeep_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 190s;
        }
    }
}
